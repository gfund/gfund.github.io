  bell.volume = 1.0;
  try { const ctx = new AudioContext(); const src = ctx.createMediaElementSource(bell); const gain = ctx.createGain(); gain.gain.value = 4.0; src.connect(gain); gain.connect(ctx.destination); } catch(e) {}
  bell.play().catch(e => {});
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 800, H = 450;
canvas.width = W; canvas.height = H;

// Scale to fit screen
function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
resize();
window.addEventListener('resize', resize);

// Load images
function loadImg(src) {
  return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
}

async function main() {
  const [bgTitle, bgLevel, imgMatt, imgGinger] = await Promise.all([
   
    loadImg(SRC_BG_LEVEL),
    loadImg(SRC_MATT),
    loadImg(SRC_GINGER),
  ]);

  // State machine
  // 0: title screen
  // 1: cutscene - ginger and matt face off
  // 2: cutscene - speech bubble
  // 3: cutscene - matt backflips off screen
  // 4: title card drop
  // 5: press start

  let phase = 0;
  let timer = 0;

  // Matt backflip state
  let mattX = 520, mattY = 300;
  let mattAngle = 0;
  let mattVY = 0;
  let mattVX = 0;
  let mattScale = 1;

 

  // Flash/shake
  let shakeX = 0;
  let flashAlpha = 0;

  // Press start blink
  let blinkTimer = 0;

  // Advance on click/tap/space
  function advance() {
    if (phase === 0) { 
      phase = 1; timer = 0;
      initAudio();
      if (!musicPlaying) playMarioTheme();
    }
    else if (phase === 5) { 
      phase = 1; timer = 0; mattX = 520; mattY = 300; mattAngle = 0; mattVY = 0; mattVX = 0; mattScale = 1; titleY = -120; flashAlpha = 0;
      if (!musicPlaying) playMarioTheme();
    }
  }
  window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') advance(); });
  canvas.addEventListener('click', advance);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); advance(); }, { passive: false });

  function drawSpeechBubble(text, bx, by, bw, bh) {
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 3;
    const r = 14;
    ctx.beginPath();
    ctx.moveTo(bx + r, by);
    ctx.lineTo(bx + bw - r, by);
    ctx.quadraticCurveTo(bx + bw, by, bx + bw, by + r);
    ctx.lineTo(bx + bw, by + bh - r);
    ctx.quadraticCurveTo(bx + bw, by + bh, bx + bw - r, by + bh);
    ctx.lineTo(bx + r, by + bh);
    ctx.quadraticCurveTo(bx, by + bh, bx, by + bh - r);
    ctx.lineTo(bx, by + r);
    ctx.quadraticCurveTo(bx, by, bx + r, by);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Tail pointing down-LEFT toward Ginger below-left
    ctx.beginPath();
    ctx.moveTo(bx + 20, by + bh);
    ctx.lineTo(bx - 30, by + bh + 50);
    ctx.lineTo(bx + 60, by + bh);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#cc0000';
    ctx.font = 'bold 22px Impact';
    ctx.textAlign = 'center';
    const lines = text.split('\n');
    lines.forEach((line, i) => {
      ctx.fillText(line, bx + bw / 2, by + 34 + i * 28);
    });
  }

  function loop() {
    requestAnimationFrame(loop);
    timer++;

    ctx.clearRect(0, 0, W, H);

    // PHASE 0: Title screen
    if (phase === 0) {
    
      // Dark overlay
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(0, 0, W, H);


      // Shadow
      
      
      // Main text
     

      // Press space
      blinkTimer++;
      if (Math.floor(blinkTimer / 30) % 2 === 0) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px Impact';
        ctx.textAlign = 'center';
        ctx.fillText('PRESS SPACE OR TAP TO START', W/2, H/2 + 60);
      }
      return;
    }

    // PHASES 1-5: Cutscene
    ctx.save();
    if (shakeX > 0) { ctx.translate((Math.random()-0.5)*shakeX, (Math.random()-0.5)*shakeX*0.5); shakeX -= 0.5; }

    // BG
    ctx.drawImage(bgLevel, 0, 0, W, H);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(0, 0, W, H);

    // PHASE 1: Characters enter
    if (phase === 1) {
      // Ginger slides in from left
      const gingerX = Math.min(80, timer * 4 - 200);
      const gingerY = 320;
      ctx.drawImage(imgGinger, gingerX, gingerY, 80, 110);

      // Matt slides in from right
      const mx = Math.max(560, W + 200 - timer * 4);
      ctx.save();
      ctx.scale(-1, 1);
      ctx.drawImage(imgMatt, -mx - 80, 330, 80, 110);
      ctx.restore();

      mattX = mx;
      mattY = 330;

      if (timer > 90) { phase = 2; timer = 0; }
    }

    // PHASE 2: Speech bubble
    if (phase === 2) {
      // Static characters
      ctx.drawImage(imgGinger, 80, 320, 80, 110);
      ctx.save();
      ctx.scale(-1, 1);
      ctx.drawImage(imgMatt, -mattX - 80, mattY, 80, 110);
      ctx.restore();

      // Bubble appears with scale animation
      const bubbleScale = Math.min(1, timer / 15);
      ctx.save();
      ctx.translate(W/2 - 20, 120);
      ctx.scale(bubbleScale, bubbleScale);
      ctx.translate(-(W/2 - 20), -120);
      drawSpeechBubble("YOU'RE OFF PROXY,\nMATT!!", 180, 170, 340, 90);
      ctx.restore();

      // Ginger angry red eyes flash
      if (Math.floor(timer / 8) % 2 === 0) {
        ctx.fillStyle = 'rgba(255,0,0,0.3)';
        ctx.fillRect(80, 320, 80, 110);
      }

      if (timer > 120) { phase = 3; timer = 0; mattVX = 6; mattVY = -8; shakeX = 12; flashAlpha = 0.8; playBell(); }
    }

    // PHASE 3: Matt backflips off screen
    if (phase === 3) {
      ctx.drawImage(imgGinger, 80, 320, 80, 110);

      // Flash
      if (flashAlpha > 0) {
        ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
        ctx.fillRect(0, 0, W, H);
        flashAlpha -= 0.05;
      }

      mattVY += 0.4;
      mattX += mattVX;
      mattY += mattVY;
      mattAngle += 12;
      mattScale = Math.max(0.1, mattScale - 0.003);

      ctx.save();
      ctx.translate(mattX + 30, mattY + 45);
      ctx.rotate(mattAngle * Math.PI / 180);
      ctx.scale(mattScale, mattScale);
      ctx.drawImage(imgMatt, -30, -45, 60, 90);
      ctx.restore();

      // "FIRED!" text
      if (timer > 20) {
        ctx.fillStyle = '#ff0000';
        ctx.font = 'bold 48px Impact';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 8;
        ctx.fillText('FIRED!!', W/2, 200);
        ctx.shadowBlur = 0;
      }

      if (mattY > H + 100 || timer > 140) { phase = 4; timer = 0; }
    }

    // PHASE 4: Title card drops
    if (phase === 4) {
      ctx.drawImage(imgGinger, 80, 320, 80, 110);

   
     
      
    
      
      ctx.restore();

      if (timer > 80) { phase = 5; timer = 0; }
    }

    // PHASE 5: Press start
    if (phase === 5) {
      ctx.drawImage(imgGinger, 80, 320, 80, 110);

      ctx.save();
      
      
      
      ctx.restore();

      blinkTimer++;
      if (Math.floor(blinkTimer / 30) % 2 === 0) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px Impact';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 6;
        ctx.fillText('PRESS SPACE OR TAP TO PLAY AGAIN', W/2, H - 40);
        ctx.shadowBlur = 0;
      }

      // Subtitle
   
      ctx.fillText('Matt must reclaim his proxy title from Queen Ginger', W/2, titleTargetY + 40);
    }

    ctx.restore();
  }

  loop();
}

main();
</script>
