<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Supabase Table</title>
  <style>
    .table-img {
  max-width: 80px;
  max-height: 80px;
  object-fit: contain;   /* show full image without cropping */
  border-radius: 6px;
  background: #f8f8f8;
  display: block;
}
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    th {
      background: #f4f4f4;
    }
  </style>
</head>
<body>

<h1>Products</h1>

<table id="data-table">
  <thead>
    <tr id="table-head"></tr>
  </thead>
  <tbody id="table-body"></tbody>
</table>

<!-- Supabase JS client -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
  // 🔑 CONFIG
  const SUPABASE_URL = "https://rtrbyypiquuqjnrjmiaj.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_Vcuz7gn3HwLYhYyXxFTESQ_4dKMVgn4";

  // ✅ FIX: do NOT name this `supabase`
  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  async function loadTable() {
    const { data, error } = await supabaseClient
      .from("Items")
      .select("*");

    if (error) {
      console.error("Supabase error:", error);
      return;
    }

    if (!data || data.length === 0) return;

    const headRow = document.getElementById("table-head");
    const body = document.getElementById("table-body");

    headRow.innerHTML = "";
    body.innerHTML = "";

    // headers
    Object.keys(data[0]).forEach(key => {
      const th = document.createElement("th");
      th.textContent = key;
      headRow.appendChild(th);
    });

    // rows
    data.forEach(row => {
      const tr = document.createElement("tr");
      
   Object.entries(row).forEach(([key, value]) => {
  const td = document.createElement("td");

  if (key === "image" && value) {
    const img = document.createElement("img");
    img.src = value;
    img.alt = "product image";
    img.loading = "lazy";
    img.className = "table-img";
    td.appendChild(img);
  } else {
    td.textContent = value ?? "";
  }

  tr.appendChild(td);
});
      body.appendChild(tr);
    });
  }

  loadTable();
</script>

</body>
</html>
