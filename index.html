<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gfund</title>
  <style>
    * {
    
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    @import url('https://fonts.googleapis.com/css2?family=SUSE+Mono:ital,wght@0,100..800;1,100..800&display=swap');

body {
  font-family: 'SUSE Mono', monospace;
  background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTtWKvsj-_qJdN3lE-biDK5vT3GzbxOUCnasUXWJxkDlQ');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  
  padding: 4rem 2rem;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
    
    .viewport {
      max-width: 550px;
      width: 100%;
    }
    
    .hero {
      margin-bottom: 3rem;
    }
    
    .name {
      font-size: 56px;
      font-weight: 500;
      margin-bottom: 1.5rem;
      letter-spacing: -1px;
    }
    
    .name a {
       color: #D2B48C;
      text-decoration: none;
    }
    
    .name a:hover {
      color: #2563eb;
    }
    
    .intro {
      font-size: 20px;
        color: #D2B48C;
      line-height: 1.8;
      margin-bottom: 2rem;
    }
    
    .footer {
      font-size: 14px;
      color: #999999;
      line-height: 1.8;
    }
    
    .footer a {
      color: #d1cfcf;
      text-decoration: none;
    }
    
    .footer a:hover {
      text-decoration: underline;
    }
    hr{
      border-top: 3px dotted #989898;
      border-bottom: none;
      width: 70%; 
      margin: 10px;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="hero">
      <h1 class="name"><a href="https://github.com/gfund">gfund</a></h1>
      <hr>
      <p class="intro">Building things from scratch. Engines, tools, systems that actually work. </p>
    </div>
    
    
    </div>
  </div>
</body>
</html>
